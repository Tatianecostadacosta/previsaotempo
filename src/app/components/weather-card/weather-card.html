<div class="flex justify-center mb-8">

  <!-- Loading spinner -->
  <div *ngIf="loading" class="text-center py-12">
    <div class="inline-block w-14 h-14 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
    <p class="mt-4 text-white font-medium text-lg drop-shadow">Buscando clima...</p>
  </div>

  <!-- Card do clima -->
  <div *ngIf="weather && !loading"
    class="bg-white/30 backdrop-blur-md rounded-3xl shadow-2xl p-8 w-full max-w-lg text-center border border-white/40">

    <!-- Cidade e país -->
    <h2 class="text-3xl font-bold text-white drop-shadow-md">
      {{ weather.name }}, {{ weather.sys.country }}
    </h2>

    <!-- Ícone do clima -->
    <img
      [src]="'https://openweathermap.org/img/wn/' + weather.weather[0].icon + '@2x.png'"
      [alt]="weather.weather[0].description"
      class="mx-auto w-28 h-28 drop-shadow-lg"
    />

    <!-- Temperatura -->
    <p class="text-7xl font-bold text-white drop-shadow-md">
      {{ weather.main.temp | number:'1.0-0' }}°C
    </p>

    <!-- Descrição -->
    <p class="text-white/90 capitalize mt-2 text-xl drop-shadow">
      {{ weather.weather[0].description }}
    </p>

    <!-- Detalhes -->
    <div class="grid grid-cols-3 gap-3 mt-6 text-sm">
      <div class="bg-white/40 backdrop-blur-sm rounded-2xl p-3 border border-white/50">
        <p class="text-2xl font-bold text-gray-700">{{ weather.main.humidity }}%</p>
        <p class="text-gray-600 mt-1">💧 Umidade</p>
      </div>
      <div class="bg-white/40 backdrop-blur-sm rounded-2xl p-3 border border-white/50">
        <p class="text-2xl font-bold text-gray-700">{{ weather.wind.speed }}</p>
        <p class="text-gray-600 mt-1">💨 m/s</p>
      </div>
      <div class="bg-white/40 backdrop-blur-sm rounded-2xl p-3 border border-white/50">
        <p class="text-2xl font-bold text-gray-700">{{ weather.main.feels_like | number:'1.0-0' }}°C</p>
        <p class="text-gray-600 mt-1">🌡️ Sensação</p>
      </div>
    </div>

  </div>

</div>
