<header class="bg-white/20 backdrop-blur-md text-white shadow-lg">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">

    <div class="flex items-center gap-3">
      <span class="text-3xl">🌤️</span>
      <h1 class="text-2xl font-bold tracking-wide drop-shadow">Previsão do Tempo</h1>
    </div>

    <button
      (click)="toggleDark()"
      class="bg-white/20 hover:bg-white/40 px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 backdrop-blur-sm border border-white/30"
    >
     {{ darkMode ? '🌙 Escuro' : '☀️ Claro' }}
    </button>

  </div>
</header>
