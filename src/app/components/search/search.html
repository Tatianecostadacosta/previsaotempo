<div class="flex justify-center mb-8">
  <form (submit)="onSearch($event)" class="flex w-full max-w-md shadow-2xl rounded-2xl overflow-hidden border border-white/40 backdrop-blur-md">
    <input
      #cityInput
      type="text"
      placeholder="🔍 Digite o nome da cidade..."
      class="flex-1 px-5 py-4 text-gray-700 bg-white/70 outline-none text-base placeholder-gray-400"
    />
    <button
      type="submit"
      class="bg-sky-500 hover:bg-sky-600 text-white px-6 py-4 font-semibold transition-all duration-200 text-base"
    >
      Buscar
    </button>
  </form>
</div>
